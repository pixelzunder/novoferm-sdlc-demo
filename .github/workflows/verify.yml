name: verify
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Secrets and personal data
        run: python scripts/scan_sensitive.py --all
      - name: Lint, types, tests, coverage
        run: python scripts/verify.py
