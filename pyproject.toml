[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doorcfg"
version = "0.1.0"
description = "Fictional garage door configurator - demo repository for the agentic SDLC workshop"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=doorcfg --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
omit = ["*/doorcfg/__main__.py"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

[tool.ruff]
line-length = 100
extend-exclude = ["exercises", "solutions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["doorcfg"]
